<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" role="img" aria-labelledby="t d">
<title id="t">Cross-section of a two-part composite wing mold</title>
<desc id="d">Technical illustration: an upper and lower mold half separated along the parting line, with a laminated wing section resting in the lower cavity and alignment dowels at both ends.</desc>
